name: tests

on:
    push:
        branches: [main, master, '2.x']
    pull_request:
        branches: [main, master, '2.x']

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
                laravel: ['12.*', '13.*']
                include:
                    - laravel: '12.*'
                      testbench: '10.*'
                    - laravel: '13.*'
                      testbench: '11.*'

        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: json, openssl, mbstring, curl
                  coverage: none

            - name: Cache Composer packages
              uses: actions/cache@v4
              with:
                  path: ~/.composer/cache/files
                  key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
                  restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

            - name: Install dependencies
              run: |
                  composer require \
                    "illuminate/contracts:${{ matrix.laravel }}" \
                    "orchestra/testbench:${{ matrix.testbench }}" \
                    --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --no-progress

            - name: Run tests
              run: vendor/bin/pest --ci
